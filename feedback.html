
<!DOCTYPE html>
<html>
<head>
  <title>Assignment Portal Test Feedback</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f1e8;
      color: #111d29;
      padding: 50px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 40px;
      border: 1px solid #ddd;
    }

    h1 {
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      margin: 15px 0 25px;
      font-weight: bold;
      background: #dff3e4;
      color: #176b35;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #111d29;
      color: white;
    }

    .pass {
      color: #176b35;
      font-weight: bold;
    }

    .fail {
      color: #a12626;
      font-weight: bold;
    }

    .summary {
      margin-top: 25px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Assignment Portal</h1>

    <p>Jenkins Automated Test Feedback</p>

    <div class="status">
      Overall Status: PASSED
    </div>

    <table>

      <tr>
        <th>Component</th>
        <th>Result</th>
      </tr>

      
      <tr>
        <td>Splash Screen</td>
        <td class="pass">
          ✓ PASS
        </td>
      </tr>
    
      <tr>
        <td>Login Page</td>
        <td class="pass">
          ✓ PASS
        </td>
      </tr>
    
      <tr>
        <td>Register Page</td>
        <td class="pass">
          ✓ PASS
        </td>
      </tr>
    

    </table>

    <div class="summary">

      <p>
        <strong>Total Tests:</strong> 3
      </p>

      <p>
        <strong>Passed:</strong> 3
      </p>

      <p>
        <strong>Failed:</strong> 0
      </p>

    </div>

    <hr>

    <p>
      Generated automatically by Jenkins.
    </p>

  </div>

</body>
</html>
